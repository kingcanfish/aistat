name: Debug tap token

# Temporary. Answers what HOMEBREW_TAP_TOKEN can actually do against the tap,
# because a 403 on push says only that it cannot write, not why. Nothing here
# prints the token, and the write probe creates a dangling blob, which is
# invisible in the repository and garbage-collected. Delete once the tap push
# works.
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Ask GitHub what the token can do
        env:
          T: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: kingcanfish/homebrew-tap
        run: |
          set -uo pipefail

          if [ -z "$T" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty."
            exit 1
          fi

          case "$T" in
            github_pat_*) kind="fine-grained PAT" ;;
            ghp_*)        kind="classic PAT" ;;
            gho_*)        kind="OAuth token (from gh auth, not a PAT)" ;;
            ghs_*)        kind="GitHub App installation token" ;;
            *)            kind="unrecognized prefix" ;;
          esac
          echo "kind   : $kind"
          echo "length : ${#T}"

          echo
          echo "--- identity ---"
          curl -sS -H "Authorization: Bearer $T" https://api.github.com/user \
            | python3 -c 'import json,sys; print("login:", json.load(sys.stdin).get("login"))'

          echo
          echo "--- classic scopes (empty line means fine-grained) ---"
          curl -sSI -H "Authorization: Bearer $T" https://api.github.com/user \
            | grep -i '^x-oauth-scopes:' || echo "(none reported)"

          echo
          echo "--- can it see the tap? ---"
          code=$(curl -sS -o repo.json -w '%{http_code}' \
                 -H "Authorization: Bearer $T" "https://api.github.com/repos/${TAP}")
          echo "GET /repos/${TAP} -> $code"

          echo
          echo "--- can it WRITE to the tap? (creates a dangling blob) ---"
          code=$(curl -sS -o write.json -D write.head -w '%{http_code}' \
                 -X POST -H "Authorization: Bearer $T" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${TAP}/git/blobs" \
                 -d '{"content":"probe","encoding":"utf-8"}')
          echo "POST /repos/${TAP}/git/blobs -> $code"
          if [ "$code" = "201" ]; then
            echo "Contents: write is GRANTED. The 403 on push is not this token's scope."
          else
            python3 -c 'import json;print("message:", json.load(open("write.json")).get("message"))' || true
            # On a fine-grained 403 GitHub names the permission it wanted.
            grep -i '^x-accepted-github-permissions:' write.head || true
            echo "Contents: write is DENIED."
          fi
