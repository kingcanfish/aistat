[package]
name = "aistat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for aistat: status providers, normalization, config and snapshot diffing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `system-proxy` is a reqwest default we'd otherwise lose to
# `default-features = false`. Without it the client only sees HTTP(S)_PROXY
# env vars, which a GUI app launched from Finder never has; with it, macOS
# System Settings → Network → Proxies and the Windows registry are read too.
#
# `-no-provider` leaves the crypto backend to us — see providers::build_client
# for why it's graviola. Native roots rather than a bundled root set, so a
# proxy that re-signs traffic with a CA in the system keychain still works.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots-no-provider",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
futures = "0.3"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# So `examples/smoke.rs` prints the same diagnostics the app does.
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
