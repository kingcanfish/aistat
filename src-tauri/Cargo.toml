[package]
name = "aistat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform status bar monitor for AI service status pages"

[lib]
name = "aistat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
aistat-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
notify-rust = "4"
open = "5"
futures = "0.3"
log = "0.4"
# Default features pull in colour detection and regex filtering we don't need;
# `humantime` keeps a readable timestamp on each line.
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }

# Read the menu bar's own appearance, which is not the system appearance —
# see `src/appearance.rs`. Both are already in the tree via `tray-icon`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  # `NSBundle` is not for the appearance probe: it answers whether we are
  # running from a real bundle, which decides the notification identity.
  "NSBundle",
  "NSDictionary",
  "NSKeyValueObserving",
  "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAppearance",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
